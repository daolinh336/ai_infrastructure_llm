services:
  web:
    image: nginx:stable
    restart: unless-stopped
    deploy:
      replicas: 1
    ports:
      - 64:80
    environment: {}
    depends_on:
      - backend
    networks:
      - app-network
  backend:
    image: node:20-alpine
    restart: unless-stopped
    deploy:
      replicas: 2
    environment: {}
    depends_on:
      - db-1
    command:
      - tail
      - -f
      - /dev/null
    networks:
      - app-network
  db-1:
    image: postgres:16
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: abcabcabc
      POSTGRES_PASSWORD: abcabcabc
    volumes:
      - db-data-1:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
  db-2:
    image: postgres:16
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: abcabcabc
      POSTGRES_PASSWORD: abcabcabc
    depends_on:
      - db-1
    volumes:
      - db-data-2:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
  db-3:
    image: postgres:16
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: abcabcabc
      POSTGRES_PASSWORD: abcabcabc
    depends_on:
      - db-1
    volumes:
      - db-data-3:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
networks:
  app-network: {}
volumes:
  db-data-1: {}
  db-data-2: {}
  db-data-3: {}
