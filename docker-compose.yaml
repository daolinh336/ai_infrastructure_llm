services:
  postgres-1:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: abcabcabc
      POSTGRES_PASSWORD: pw-8f76cb7615f2af1b681aa0ca
    volumes:
      - test-postgres-data-1:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U abcabcabc
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-app-network
  postgres-2:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: abcabcabc
      POSTGRES_PASSWORD: pw-fd98847a94ad70891602c7aa
    depends_on:
      - postgres-1
    volumes:
      - test-postgres-data-2:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U abcabcabc
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-app-network
  api:
    image: node:20-alpine
    restart: unless-stopped
    deploy:
      replicas: 1
    environment: {}
    depends_on:
      - postgres-1
      - postgres-2
    command:
      - tail
      - -f
      - /dev/null
    networks:
      - test-app-network
  nginx:
    image: nginx:stable
    restart: unless-stopped
    deploy:
      replicas: 1
    ports:
      - 80:80
    environment: {}
    depends_on:
      - api
    networks:
      - test-app-network
networks:
  test-app-network: {}
volumes:
  test-postgres-data-1: {}
  test-postgres-data-2: {}
