services:
  nginx:
    image: nginx:stable
    restart: unless-stopped
    deploy:
      replicas: 1
    ports:
      - 80:80
    environment: {}
    depends_on:
      - api
    networks:
      - test-app-network
  api:
    image: node:20-alpine
    restart: unless-stopped
    deploy:
      replicas: 2
    environment: {}
    depends_on:
      - mongo-1
    command:
      - tail
      - -f
      - /dev/null
    networks:
      - test-app-network
  mongo-1:
    image: mongo:7
    restart: unless-stopped
    deploy:
      replicas: 1
    environment: {}
    volumes:
      - test-mongo-1-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-app-network
networks:
  test-app-network: {}
volumes:
  test-mongo-1-data: {}
