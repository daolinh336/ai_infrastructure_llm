name: Publish to MCP Registry

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for GitHub OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update server.json version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            pkg.version = '$VERSION';
            if (pkg.packages && pkg.packages[0]) {
              pkg.packages[0].version = '$VERSION';
            }
            fs.writeFileSync('server.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated server.json to version', pkg.version);
          "

      - name: Authenticate with MCP Registry
        id: auth
        run: |
          node scripts/mcp-auth.mjs > /tmp/registry-jwt.txt
          echo "registry_jwt=$(cat /tmp/registry-jwt.txt)" >> "$GITHUB_OUTPUT"
          echo "Authenticated"

      - name: Publish to MCP Registry
        run: REGISTRY_JWT="${{ steps.auth.outputs.registry_jwt }}" node scripts/publish-registry.mjs
